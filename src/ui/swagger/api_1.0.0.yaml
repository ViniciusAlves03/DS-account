openapi: 3.0.0
info:
  title: Account Service API
  version: "1.0.0"
  description: "Microservice for managing user accounts, including Admins, Holders, and Dependents."
servers:
  - url: http://localhost:3000/
    description: Local development server

paths:
  /v1/admins:
    post:
      tags:
        - Admins
      summary: Add a new Administrator
      description: Creates a new Administrator-type user in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInput'
      responses:
        '201':
          description: Administrator created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          description: Invalid request (e.g., email already exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
        - Admins
      summary: List all Administrators
      description: Returns a paginated list of all Administrator-type users.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page.
      responses:
        '200':
          description: List of administrators returned successfully.
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of administrators.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Admin'

  /v1/admins/{admin_id}:
    get:
      tags:
        - Admins
      summary: Get Administrator by ID
      description: Returns the details of a specific administrator.
      parameters:
        - name: admin_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '404':
          description: Administrator not found.
    patch:
      tags:
        - Admins
      summary: Update an Administrator
      description: Updates the data of an existing administrator.
      parameters:
        - name: admin_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdate'
      responses:
        '200':
          description: Administrator updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '404':
          description: Administrator not found.

  /v1/holders:
    post:
      tags:
        - Holders
      summary: Add a new Holder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolderInput'
      responses:
        '201':
          description: Holder created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holder'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
        - Holders
      summary: List all Holders
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holder'

  /v1/holders/{holder_id}:
    get:
      tags:
        - Holders
      summary: Get Holder by ID
      parameters:
        - name: holder_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holder'
        '404':
          description: Holder not found.
    patch:
      tags:
        - Holders
      summary: Update a Holder
      parameters:
        - name: holder_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolderUpdate'
      responses:
        '200':
          description: Holder updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holder'
        '404':
          description: Holder not found.
    delete:
      tags:
        - Holders
      summary: Remove a Holder
      parameters:
        - name: holder_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '204':
          description: Holder removed successfully.
        '404':
          description: Holder not found.

  /v1/holders/{holder_id}/dependents:
    post:
      tags:
        - Holders
      summary: Add a Dependent to a Holder
      parameters:
        - name: holder_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependentInput'
      responses:
        '201':
          description: Dependent associated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependent'
        '404':
          description: Holder not found.

  /v1/holders/{holder_id}/dependents/{dependent_id}:
    patch:
      tags:
        - Holders
      summary: Update Dependent's authorization
      description: Sets whether the dependent is authorized by the holder.
      parameters:
        - name: holder_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
        - name: dependent_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAuthorized:
                  type: boolean
              required:
                - isAuthorized
      responses:
        '200':
          description: Authorization updated successfully.
        '404':
          description: Holder or dependent not found.
    delete:
      tags:
        - Holders
      summary: Disassociate a Dependent from a Holder
      parameters:
        - name: holder_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
        - name: dependent_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '204':
          description: Association removed successfully.
        '404':
          description: Holder or dependent not found.

  /v1/dependents:
    get:
      tags:
        - Dependents
      summary: List all Dependents
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dependent'

  /v1/dependents/{dependent_id}:
    get:
      tags:
        - Dependents
      summary: Get Dependent by ID
      parameters:
        - name: dependent_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependent'
        '404':
          description: Dependent not found.
    patch:
      tags:
        - Dependents
      summary: Update a Dependent
      parameters:
        - name: dependent_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependentUpdate'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependent'
        '404':
          description: Dependent not found.
    delete:
      tags:
        - Dependents
      summary: Remove a Dependent
      parameters:
        - name: dependent_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '204':
          description: Dependent removed successfully.
        '404':
          description: Dependent not found.

  /v1/users:
    get:
      tags:
        - Users
      summary: List all Users
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /v1/users/{user_id}:
    delete:
      tags:
        - Users
      summary: Remove a User
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '204':
          description: User removed successfully.
        '404':
          description: User not found.

  /v1/users/{user_id}/avatar:
    put:
      tags:
        - Users
      summary: Add or update user avatar
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '201':
          description: Avatar saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
    get:
      tags:
        - Users
      summary: Get user avatar
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '200':
          description: Success.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Avatar not found.
    delete:
      tags:
        - Users
      summary: Remove user avatar
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '204':
          description: Avatar removed successfully.

  /v1/auth:
    post:
      tags:
        - Auth
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
        '401':
          description: Unauthorized.

  /v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
        '401':
          description: Invalid token.

  /v1/auth/forgot:
    post:
      tags:
        - Auth
      summary: Request password recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '226':
          description: If a matching account is found, an email will be sent.

  /v1/auth/password:
    patch:
      tags:
        - Auth
      summary: Change user password
      description: Changes the password using the old password or a reset token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: Password changed successfully.
        '400':
          description: Invalid request.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: mongoId
          readOnly: true
        name:
          type: string
          example: "John Doe"
        birth_date:
          type: string
          format: date
          example: "1990-01-25"
        gender:
          type: string
          enum: [male, female]
        phone_number:
          type: string
          example: "11987654321"
        language:
          type: string
          enum: [pt-BR, en-US]
        email:
          type: string
          format: email
        last_login:
          type: string
          format: date-time
          readOnly: true
        type:
          type: string
          readOnly: true
          enum: [admin, holder, dependent]

    Admin:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            total_holders:
              type: integer
              readOnly: true
            total_admins:
              type: integer
              readOnly: true
            total_dependents:
              type: integer
              readOnly: true

    Holder:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            address:
              $ref: '#/components/schemas/Address'
            dependents:
              type: array
              items:
                $ref: '#/components/schemas/Dependent'
              readOnly: true

    Dependent:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            address:
              $ref: '#/components/schemas/Address'
            isAuthorized:
              type: boolean
              default: true

    Address:
      type: object
      properties:
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
          enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
        zip_code:
          type: string

    Credentials:
      type: object
      properties:
        login:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - login
        - password

    Auth:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    Image:
      type: object
      properties:
        id:
          type: string
          format: mongoId
        content_type:
          type: string
        filename:
          type: string
        size:
          type: string
        download_link:
          type: string
          format: uri

    UserInput:
      type: object
      properties:
        name:
          type: string
          example: "Mary Smith"
        birth_date:
          type: string
          format: date
          example: "1995-05-20"
        gender:
          type: string
          enum: [male, female]
        phone_number:
          type: string
        language:
          type: string
          enum: [pt-BR, en-US]
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - name
        - birth_date
        - gender
        - email
        - password

    AdminInput:
      allOf:
        - $ref: '#/components/schemas/UserInput'

    HolderInput:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          properties:
            address:
              $ref: '#/components/schemas/Address'

    DependentInput:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          properties:
            address:
              $ref: '#/components/schemas/Address'
          required:
            - address

    AdminUpdate:
      type: object
      properties:
        name:
          type: string
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        language:
          type: string
          enum: [pt-BR, en-US]

    HolderUpdate:
      type: object
      properties:
        name:
          type: string
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        language:
          type: string
          enum: [pt-BR, en-US]
        address:
          $ref: '#/components/schemas/Address'

    DependentUpdate:
      type: object
      properties:
        name:
          type: string
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        language:
          type: string
          enum: [pt-BR, en-US]
        address:
          $ref: '#/components/schemas/Address'

    ApiError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        description:
          type: string
